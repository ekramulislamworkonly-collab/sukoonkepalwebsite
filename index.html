<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon ke pal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="glass-container">
        <h1>Sukoon ke pal</h1>
        <p class="subtitle" style="margin-bottom: 24px;">Your custom mix is ready. Press play to start!</p>

        <div class="player-wrapper">
            <!-- Local audio element created by JS -->
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="control-btn" title="Previous Song (Random)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
                <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button id="next-btn" class="control-btn" title="Next Random Song">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
        
        <div class="status-text" id="status-text">Ready to play</div>
    </div>

    <footer>
        &copy; 2026 Sukoon ke pal. Developed by ekramul.
    </footer>

    <script src="script.js"></script>
</body>
</html>
